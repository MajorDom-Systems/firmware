name: Images

# Publishes the Thread / multi-PAN host stacks so hubs pull them instead of building them. integration-sdk pins each
# by digest (runtime/peripherals/services/builtin.py): after a rebuild, copy the digest from the run summary there.
on:
  workflow_dispatch:
  push:
    branches:
      - master # develop moves with it: one build per change
    paths:
      - images/**
      - .github/workflows/images.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: multiprotocol # cpcd + zigbeed + otbr-agent, in step with the multi-PAN RCP firmware
            tag: sisdk-2025.6.3-avahi
            title: MajorDom multi-PAN host stack
            licenses: LicenseRef-Silicon-Labs-MSLA AND BSD-3-Clause AND GPL-3.0-only
          - name: otbr # upstream OpenThread Border Router, for a plain Thread RCP
            tag: openthread-acc61230
            title: MajorDom OpenThread Border Router
            licenses: BSD-3-Clause
    env:
      IMAGE: ghcr.io/majordom-systems/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ matrix.tag }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.name }}
          build-contexts: thread-source=images/thread-source
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - run: |
          {
            echo "### ${IMAGE}:${{ matrix.tag }}"
            echo '```'
            echo "${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
